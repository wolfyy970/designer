name: CI

# Until this workflow existed, nothing ran the suite automatically: the Husky
# pre-commit hook only bumps the patch version and snapshots prompts. Every gate
# below was manual-only. The whole job is ~1 minute, so it runs on every push.

on:
  push:
    branches: [main]
  pull_request:

# Superseded runs on the same ref are wasted work — the newer commit is what matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # v5+ runs on node24; v4 targets the deprecated node20 runtime.
      - uses: actions/checkout@v5

      # STAYS ON v4, deliberately. v6 of this action requires pnpm >= 11
      # ("The `version` input can be omitted only when `packageManager` ...
      # declares pnpm v11 or newer"), and this repo pins pnpm 10.10.0 via the
      # packageManager field. Upgrading would fail the install step, not just
      # warn. Revisit when the repo moves to pnpm 11.
      #
      # No `version:` input — the packageManager field in package.json pins
      # pnpm and action-setup reads it. Hardcoding a version here would
      # silently fight that pin.
      - uses: pnpm/action-setup@v4

      # v5+ runs on node24; v4 targets the deprecated node20 runtime.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # `pnpm test` chains the root Vitest suite plus the
      # @auto-designer/design-system and @auto-designer/pi package suites.
      # Hermetic: no network, no API key, no browser.
      - name: Test
        run: pnpm test

      # Browser-grounded evaluation is excluded from `pnpm test` (it launches
      # Chromium), so it gets its own step. The real-browser suite asserts
      # render/console/layout scoring against inline HTML fixtures; if Chromium
      # is missing the evaluator returns a `browser_unavailable` skip and those
      # assertions no-op, which is why the install step below is load-bearing
      # rather than an optimization.
      - name: Install Chromium for browser evaluation
        run: pnpm exec playwright install --with-deps chromium

      - name: Test browser evaluation
        run: pnpm test:playwright-eval

      # `build` runs tokens:build + `tsc -b` + vite build. Note the root
      # `tsc -b` only references tsconfig.{app,node,server} — it does NOT cover
      # either workspace package, so those get their own typecheck below.
      - name: Build
        run: pnpm build
        env:
          CI: 'true'

      # Vitest transpiles without typechecking, and the root `tsc -b` above
      # does not reference either package's tsconfig. Without these, a type
      # error in a package is invisible until something imports it at runtime.
      - name: Typecheck workspace packages
        run: |
          pnpm -F @auto-designer/pi exec tsc --noEmit
          pnpm -F @auto-designer/design-system exec tsc --noEmit
